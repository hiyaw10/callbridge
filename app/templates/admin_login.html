{% extends "base.html" %}
{% block title %}Admin — CallBridge{% endblock %}

{% block nav %}
<div class="topnav">
  <div class="topnav-inner" style="justify-content: center;">
    <span class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </span>
      CallBridge Admin
    </span>
  </div>
</div>
{% endblock %}

{% block body %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="card card-pad">
      <h1>Admin access</h1>
      <p class="auth-subtitle">Internal only — not for customer accounts</p>

      {% if error %}<div class="alert">{{ error }}</div>{% endif %}

      <form method="post" action="/admin/login">
        <div class="field">
          <label for="token">Admin token</label>
          <input type="password" id="token" name="token" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
