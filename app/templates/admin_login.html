{% extends "base.html" %}
{% block title %}Admin — CallBridge{% endblock %}

{% block nav %}
<div class="topnav">
  <div class="topnav-inner" style="justify-content: center;">
    <span class="brand">
      <img class="brand-logo" src="/static/brand/logo.png" alt="CallBridge" width="181" height="38">
      <span class="brand-tag">Admin</span>
    </span>
  </div>
</div>
{% endblock %}

{% block body %}
<div class="auth-shell-simple">
  <div class="auth-card">
    <div class="card card-pad">
      <h1>Admin access</h1>
      <p class="auth-subtitle">Internal only — not for customer accounts</p>

      {% if error %}<div class="alert">{{ error }}</div>{% endif %}

      <form method="post" action="/admin/login">
        <div class="field">
          <label for="token">Admin token</label>
          <input type="password" id="token" name="token" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
