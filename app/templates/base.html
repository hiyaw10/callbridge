<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CallBridge — Never miss another customer call{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block nav %}
  <div class="topnav">
    <div class="topnav-inner">
      <a href="/" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        CallBridge
      </a>
      <div class="nav-right">
        {% if current_business %}
          <span class="nav-business">{{ current_business.name }}</span>
          <a href="/dashboard/settings" class="btn btn-secondary btn-sm">Settings</a>
          <a href="/logout" class="btn btn-secondary btn-sm">Log out</a>
        {% else %}
          <a href="/login" class="btn btn-primary btn-sm">Log in</a>
        {% endif %}
      </div>
    </div>
  </div>
  {% endblock %}

  {% block body %}{% endblock %}

  {% block footer %}
  <div class="footer">CallBridge &mdash; missed-call text-back for local service businesses</div>
  {% endblock %}
</body>
</html>
