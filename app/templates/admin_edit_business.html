{% extends "base.html" %}
{% block title %}Admin — Edit Business{% endblock %}

{% block nav %}
<div class="topnav">
  <div class="topnav-inner">
    <span class="brand">
      <img class="brand-logo" src="/static/brand/logo.png" alt="CallBridge" width="181" height="38">
      <span class="brand-tag">Admin</span>
    </span>
    <div class="nav-right">
      <a href="/admin/businesses" class="btn btn-secondary btn-sm">Back</a>
      <a href="/admin/logout" class="btn btn-secondary btn-sm">Log out</a>
    </div>
  </div>
</div>
{% endblock %}

{% block body %}
<div class="container page">
  <div class="page-header">
    <div>
      <h1>Edit business</h1>
      <p>Update {{ business.name }}'s details.</p>
    </div>
  </div>

  {% if error %}<div class="alert" style="max-width: 600px;">{{ error }}</div>{% endif %}

  <div class="section">
    <div class="card card-pad" style="max-width: 600px;">
      <form method="post" action="/admin/businesses/{{ business.id }}/edit" id="edit-business-form">
        <div class="field">
          <label for="name">Business name</label>
          <input type="text" id="name" name="name" value="{{ business.name }}" required>
        </div>
        <div class="field">
          <label for="owner_email">Owner email</label>
          <input type="email" id="owner_email" name="owner_email" value="{{ business.owner_email }}" required>
        </div>
        <div class="field">
          <label for="owner_phone">Owner phone</label>
          <input type="tel" id="owner_phone" name="owner_phone" value="{{ business.owner_phone }}" placeholder="+15551234567" required>
        </div>
        <div class="field">
          <label for="twilio_number">Twilio number</label>
          <input type="tel" id="twilio_number" name="twilio_number" value="{{ business.twilio_number }}" placeholder="+15551234567" required>
        </div>
        <div class="field">
          <label for="password">Reset password (optional)</label>
          <input type="text" id="password" name="password" placeholder="Leave blank to keep current password">
        </div>
        <div class="field">
          <label for="notes">Remarks</label>
          <textarea id="notes" name="notes" rows="3" data-original="{{ business.notes or '' }}" placeholder="Internal notes about this business&hellip;">{{ business.notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('edit-business-form').addEventListener('submit', function (e) {
    const notes = document.getElementById('notes');
    const original = notes.dataset.original || '';
    const next = notes.value.trim();
    if (original && next !== original) {
      const confirmed = confirm(
        next
          ? 'Replace the existing remark?\n\nCurrent: "' + original + '"\nNew: "' + next + '"'
          : 'Remove the existing remark?\n\nCurrent: "' + original + '"'
      );
      if (!confirmed) e.preventDefault();
    }
  });
</script>
{% endblock %}
